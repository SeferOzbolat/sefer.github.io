name: Build Tailwind CSS
on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'input.css'
      - 'tailwind.config.js'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tailwind CSS Derle
        run: |
          npm install -D tailwindcss@3 @tailwindcss/forms @tailwindcss/container-queries
          npx tailwindcss -i ./input.css -o ./style.css --minify

      - name: Üretilen CSS Dosyasını Depoya Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add style.css
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-build style.css" && git push)